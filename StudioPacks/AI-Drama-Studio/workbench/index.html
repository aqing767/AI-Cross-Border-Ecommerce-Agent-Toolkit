<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Drama Studio</title><link rel="stylesheet" href="style.css"></head>
<body><header><div><small>PERSONAL CREATIVE OPERATING SYSTEM</small><h1>AI Drama Studio</h1><p>从故事到成片的创作控制台</p></div><div class="actions"><button id="new">新建项目</button><button id="export">导出 JSON</button><label class="import">导入 JSON<input id="import" type="file" accept=".json,application/json"></label></div></header>
<main><section class="stats"><article><small>项目</small><strong id="projectCount">0</strong></article><article><small>剧集</small><strong id="episodeCount">0</strong></article><article><small>镜头</small><strong id="shotCount">0</strong></article><article><small>待审任务</small><strong id="pendingCount">0</strong></article></section>
<div class="layout"><aside><h2>项目库</h2><div id="projects"></div></aside><section class="content"><div id="empty"><h2>你的创作工作台</h2><p>创建项目，或导入已有 project.json。项目数据仅保存在当前浏览器，导出后可交给本地 Skill 继续制作。</p></div><div id="detail" hidden><div class="projectHead"><div><small id="projectStatus"></small><h2 id="projectTitle"></h2><p id="projectMeta"></p></div><button id="delete" class="danger">删除本地副本</button></div><div class="tabs"><button data-tab="overview" class="active">总览</button><button data-tab="episodes">剧集</button><button data-tab="assets">资产</button><button data-tab="jobs">任务</button></div><div id="panel"></div></div></section></div></main><footer>离线工作台原型 · 不会自动调用第三方模型或产生费用</footer><script src="app.js"></script></body></html>
